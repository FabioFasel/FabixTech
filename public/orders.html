<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bestellungen | FabixTech</title>
    <link rel="canonical" href="https://fabixtech.ch/" />
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);

        if (window.location.hostname === 'fabio3d.pages.dev') {
            window.location.replace('https://fabixtech.ch' + window.location.pathname + window.location.search);
        }
    </script>
    <script src="https://kit.fontawesome.com/fba23d88db.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96"/>
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg"/>
    <link rel="shortcut icon" href="favicon/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png"/>
    <link rel="manifest" href="favicon/site.webmanifest"/>
    <link rel="prefetch" href="shop" as="document">
    <script src="script.js" defer></script>
    <script src="/alert.js"></script>
    <script src="/theme-toggle.js" defer></script>
    <style>
        html{
            padding-top: 85px;
        }

        h1 {
            font-size: 32px !important;
            font-weight: 800 !important;
            margin-bottom: 30px !important;
        }

        .navbar {
            position: fixed !important;
            top: 0 !important;
            width: 100% !important;
            height: 85px !important;
            background-color: var(--bg-card) !important;
            border-bottom: 1.2px solid var(--border-color) !important;
            z-index: 1000 !important;
            box-shadow: var(--shadow-sm) !important;
        }

        .nav-container {
            max-width: 1440px !important;
            margin: 0 auto !important;
            padding: 0 2.4rem !important;
            height: 100% !important;
            display: flex !important;
            justify-content: flex-start !important;
            align-items: center !important;
        }

        .btn-back {
            display: inline-block;
            margin-bottom: 0;
            color: #d40202;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #960505;
            text-decoration: underline;
        }
    </style>
</head>
<body data-no-theme-toggle>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index" class="btn-back">&larr; Zurück zur Startseite</a>
        </div>
    </nav>

    <main style="max-width: 900px; margin: 40px auto; padding: 0 20px;">
        <h1>Meine <span class="gradient-text">Bestellungen</span></h1>
        <div id="my-orders-container" style="margin-top: 24px;">Lade deine Bestellungen...</div>
    </main>
    <footer>
        <p>&copy; <span id="copyright"><script>document.getElementById('copyright').appendChild(document.createTextNode(new Date().getFullYear()))</script></span> FabixTech. Alle Rechte vorbehalten.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('my-orders-container');
            const token = localStorage.getItem('session_id') || (JSON.parse(localStorage.getItem('user') || '{}')).session_id;
            if (!token) {
                container.innerHTML = '<p>Bitte <a href="login">melde dich an</a>, um deine Bestellungen zu sehen.</p>';
                return;
            }

            try {
                const res = await fetch('/api/my-orders', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!res.ok) throw new Error();

                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="material-card" style="text-align: center; padding: 48px 24px; margin-top: 20px;">
                            <i class="fa-solid fa-box-open" style="font-size: 48px; color: var(--text-muted); margin-bottom: 16px;"></i>
                            <h3 style="font-size: 20px; margin-bottom: 8px; color: var(--text-main);">Noch keine Bestellungen</h3>
                            <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 24px;">Du hast bisher noch nichts bestellt.</p>
                            <a href="shop" class="btn btn-primary" style="text-decoration: none; display: inline-block;">Zum Shop</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(order => {
                    const trackingLink = order.tracking_number 
                        ? `<a href="https://service.post.ch/ekp-web/ui/list?mailpieces=${encodeURIComponent(order.tracking_number)}" target="_blank" class="btn btn-primary" style="display: inline-block; margin-top: 10px; font-size: 14px; padding: 8px 14px;">Paket verfolgen (Die Post) &#8599;</a>`
                        : '<p style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">Noch keine Sendungsnummer hinterlegt.</p>';

                    const itemsList = (order.items || []).map(i => `
                        <div style="display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px solid var(--border-color);">
                            <span><strong>${i.quantity}x</strong> ${i.product_name} <small style="color:var(--text-muted);">(${i.variant || 'Standard'})</small></span>
                            <span>CHF ${(Number(i.price) * Number(i.quantity)).toFixed(2)}</span>
                        </div>
                    `).join('');

                    const giftCardsHtml = (order.gift_cards && order.gift_cards.length > 0) ? `
                        <div style="margin-top: 15px; padding: 16px; background: var(--bg-dark); border-radius: 10px; border: 2px dashed var(--light-color);">
                            <strong style="font-size: 14px; color: var(--light-color); display: block; margin-bottom: 8px;"><i class="fa-solid fa-gift"></i> Deine digitalen Gutscheincodes:</strong>
                            ${order.gift_cards.map(gc => `
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; background: var(--bg-card); padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;">
                                    <code style="font-size: 16px; font-weight: 900; letter-spacing: 2px; color: var(--light-color);">${gc.code}</code>
                                    <div style="text-align: right; font-size: 13px;">
                                        <div>Initialwert: CHF ${Number(gc.initial_balance).toFixed(2)}</div>
                                        <div style="color: var(--primary); font-weight: bold;">Restguthaben: CHF ${Number(gc.current_balance ?? gc.initial_balance).toFixed(2)}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : '';

                    return `
                        <div class="material-card" style="margin-bottom: 20px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
                                <div>
                                    <strong>Bestellung #${order.id}</strong>
                                    <div style="font-size: 12px; color: var(--text-muted);">${order.created_at ? new Date(order.created_at).toLocaleString('de-CH') : ''}</div>
                                </div>
                                <span class="badge" style="background: var(--bg-dark); padding: 4px 10px; border-radius: 12px;">${order.status || 'Offen'}</span>
                            </div>
                            <div style="margin-bottom: 12px;">${itemsList}</div>
                            ${giftCardsHtml}
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px solid var(--border-color);">
                                <span>Gesamtsumme: <strong>CHF ${Number(order.total_amount).toFixed(2)}</strong></span>
                                ${trackingLink}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Fehler beim Laden deiner Bestellungen.</p>';
            }
        });
    </script>
</body>
</html>
